[package]
name = "phasmo-save-editor"
version = "1.0.0"
description = "Standalone editor for local Phasmophobia profile save files"
authors = ["PhasmoSave Editor"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "phasmo_save_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-opener = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc"] }
pbkdf2 = "0.12"
hmac = "0.12"
sha1 = "0.10"
rand = "0.8"
dirs = "5.0"
thiserror = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
